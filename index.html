<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="status"></div>
    <button id="rock" class="choice" value="Rock">Rock</button>
    <button id="paper" class="choice" value="Paper">Paper</button>
    <button id="scissor" class="choice" value="Scissor">Scissor</button>

    <script>
        // Scores for each time the human or computer wins
        let humanScore = 0;
        let computerScore = 0;

        // Initialize div screen
        let status = document.querySelector('.status');
        status.style.marginTop = '20px';
        status.style.marginBottom = '20px';
        status.style.backgroundColor = 'lightgreen';
        status.style.width = '200px';
        status.style.height = '150px';

        // Buttons
        let rock = document.getElementById('rock');
        let paper = document.getElementById('paper');
        let scissor = document.getElementById('scissor');
        rock.addEventListener('click', () => playRound('rock'))
        paper.addEventListener('click', () => playRound('paper'))
        scissor.addEventListener('click', () => playRound('scissor'))

        function playRound(humanChoice) {
            let player1Choice = humanChoice;
            let player2Choice = getComputerChoice();
            let displayScores;
            let choices = `Human chose ${player1Choice} and computer chose ${player2Choice}.
            
            `
            let outcome;


            if (player1Choice === player2Choice) {
                outcome = 'Draw. No points!'
            } else if (player1Choice === 'rock' && player2Choice === 'paper') {
                outcome = 'You lose! Paper beats rock'
                computerScore++;
            } else if (player1Choice === 'rock' && player2Choice === 'scissor') {
                outcome = ('You win! Rock beats scissor')
                humanScore++;
            } else if (player1Choice === 'paper' && player2Choice === 'rock') {
                outcome = 'You win! Paper beats rock'
                humanScore++;
            } else if (player1Choice === 'paper' && player2Choice === 'scissor') {
                outcome = 'You lose! Scissor beats paper'
                computerScore++;
            } else if (player1Choice === 'scissor' && player2Choice === 'rock') {
                outcome = 'You lose! Rock beats scissor'
                computerScore++;
            } else if (player1Choice === 'scissor' && player2Choice === 'paper') {
                outcome = 'You win! Scissor beats paper'
                humanScore++;
            }

            displayScores =  `Human Score: ${humanScore}
                            Computer Score: ${computerScore}
                            
                            `

            if(humanScore===5) {
                status.innerText = 'You have won the game!'
            } else if(computerScore===5) {
                status.innerText = 'You have lost the game!'
            } else {
                status.innerText = `${displayScores} ${choices} ${outcome}`
            }
        }

        // Randomly return "rock", "paper" or "scissors"
        function getComputerChoice() {
            // Create a random number between 1 and 3 inclusive
            const random = Math.floor(Math.random() * (4 - 1) + 1);

            if (random === 1) {
                return 'rock'
            } else if (random === 2) {
                return 'paper'
            } else {
                return 'scissor'
            }
        }

    </script>
</body>

</html>
